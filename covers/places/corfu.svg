  <text x="400" y="500" text-anchor="middle" fill="#457b9d" font-family="'Cinzel', 'GFS Didot', serif" font-size="16" letter-spacing="6" opacity="0.85">Κέρκυρα</text>
  <text x="400" y="534" text-anchor="middle" fill="#9ca3af" font-family="'Inter', sans-serif" font-size="12" letter-spacing="2" font-style="italic">Der grüne Norden</text>
