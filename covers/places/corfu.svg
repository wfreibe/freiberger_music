      <stop offset="0%" stop-color="#457b9d" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#457b9d" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1116" />
      <stop offset="100%" stop-color="#07080a" />
