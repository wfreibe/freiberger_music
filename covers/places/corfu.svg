  <circle cx="776" cy="24" r="3" fill="#457b9d" opacity="0.6" />
  <circle cx="24" cy="576" r="3" fill="#457b9d" opacity="0.6" />
  <circle cx="776" cy="576" r="3" fill="#457b9d" opacity="0.6" />

