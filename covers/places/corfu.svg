  <text x="400" y="75" text-anchor="middle" fill="#457b9d" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="12" letter-spacing="4" opacity="0.9">39.624° N, 19.921° E</text>
  <text x="400" y="98" text-anchor="middle" fill="#7a8291" font-family="'Inter', sans-serif" font-size="10" letter-spacing="3" text-transform="uppercase">FREIBERGER ARCHIV · SCHAUPLATZ</text>

  <!-- Central Motif -->
  <!-- Venetian Arch & Northern Horizon Motif -->
      <path d="M 270 360 L 270 240 C 270 170, 530 170, 530 240 L 530 360" fill="none" stroke="#457b9d" stroke-width="8" stroke-linecap="round" opacity="0.9" />
      <!-- Cypress silhouettes -->
