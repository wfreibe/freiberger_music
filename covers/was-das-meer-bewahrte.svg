<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1318"/>
      <stop offset="60%" stop-color="#15242b"/>
      <stop offset="100%" stop-color="#091014"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#387780" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2b5c7d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#d4b483"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Subtle Horizon Plane -->
  <rect x="100" y="440" width="600" height="180" fill="url(#horizon)" rx="4"/>
  <line x1="80" y1="440" x2="720" y2="440" stroke="#e8e5de" stroke-opacity="0.15" stroke-width="1"/>
  
  <!-- Abstract Geometric Stone & Sun -->
  <circle cx="400" cy="360" r="110" fill="none" stroke="#e8e5de" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="400" cy="360" r="6" fill="url(#gold)"/>
  <polygon points="340,540 460,540 400,280" fill="#e8e5de" fill-opacity="0.04" stroke="#e8e5de" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Label / Typography -->
  <text x="400" y="680" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="#e8e5de" text-anchor="middle">FREIBERGER</text>
  <text x="400" y="710" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="4" fill="#387780" text-anchor="middle">WAS DAS MEER BEWAHRTE</text>
</svg>
